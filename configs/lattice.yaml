seed: 0

# Reference acquisition. Any field of sufficiency.acquisition.Acquisition can be set here.
defaults:
  snr: 40                    # mild thermal noise, so reconstruction effects (SENSE noise amplification) show
  coils: 8
  recon: sense               # sense | zero_filled
  sense_iters: 10
  phase_amplitude: 1.5       # radians of smooth background phase
  center_fraction: 0.08
  undersampling: equispaced  # equispaced (parallel imaging) | random (compressed sensing)
  slice_profile: rect
  motion_shift_mm: 2.0
  motion_rotation_deg: 2.0
  motion_ordering: linear

# Single-axis ladders: one axis changes, everything else stays at the reference.
# Main-paper axes: snr, slice_mm, accel, motion_frac, missing. The others are supplementary.
axes:
  snr:             [40, 20, 10, 5, 3]
  slice_mm:        [1, 2, 3, 4, 5, 6]
  accel:           [1, 2, 3, 4, 6, 8]
  motion_frac:     [0.0, 0.05, 0.1, 0.2, 0.3, 0.4]
  missing:         [0, 1, 2, 3]                    # drops t1c, then t2f, then t2w
  inplane_keep:    [1.0, 0.75, 0.5, 0.375, 0.25]   # 0.5 ~ 2 mm in-plane resolution
  partial_fourier: [1.0, 0.875, 0.75, 0.625]
  contrast:        [1.0, 0.85, 0.7, 0.55, 0.4]     # low-field contrast proxy; calibrate first
  bias:            [0.0, 0.1, 0.2, 0.3, 0.4]

missing_order: [t1c, t2f, t2w]

# Combined profiles: realistic low-resource acquisitions.
# These values are starting points. Replace them with calibrated values (scripts/calibrate.py)
# before the final experiments, and report how they were chosen.
profiles:
  portable_64mT_like:       {snr: 5, slice_mm: 5, inplane_keep: 0.6, contrast: 0.6, bias: 0.2}
  portable_64mT_no_gado:    {snr: 5, slice_mm: 5, inplane_keep: 0.6, contrast: 0.6, bias: 0.2, missing: 1}
  older_1p5T_thick:         {snr: 15, slice_mm: 5, slice_gap_mm: 1}
  older_1p5T_fast:          {snr: 15, slice_mm: 4, accel: 2, partial_fourier: 0.75}
  lmic_typical:             {snr: 15, slice_mm: 5, slice_gap_mm: 1, bias: 0.2}
  lmic_typical_motion:      {snr: 15, slice_mm: 5, slice_gap_mm: 1, bias: 0.2, motion_frac: 0.2}
  fast_protocol:            {snr: 20, accel: 4, partial_fourier: 0.75}
  worst_case:               {snr: 5, slice_mm: 6, accel: 4, motion_frac: 0.2, missing: 1}

# Patient-level splits for BraTS 2023 GLI (BraTS-Africa is kept entirely as external test data).
splits:
  fractions: {train: 0.7, calibration: 0.1, test: 0.2}

# Grid for scripts/calibrate.py (matching a high-field scan to a real low-field scan).
calibration:
  grid:
    snr: [40, 30, 20, 15, 10, 7, 5, 3]
    slice_mm: [1, 3, 5]
    inplane_keep: [1.0, 0.75, 0.5]
    contrast: [1.0, 0.8, 0.6, 0.4]
